# CI as a dependency graph (foundation/01; db stages foundation/02,
# checks port foundation/06). Repo-metadata checks validate files and
# need no schema, so they run before any database boots. `make
# metadata` is `node checks/run.mjs --metadata`, which also prints the
# workable frontier; the database chain then gates the language suites.
#
# The go/ts jobs' `needs: [db-migrate]` is ordering only, not a data
# dependency: every job is an isolated runner, and db-migrate tears its
# Postgres pair down before finishing. The plane-separation tests those
# jobs run are compile/typecheck-level and need no database; when a later
# task adds Go/TS tests that talk to one, those jobs must boot their own
# Postgres, compose or a service container, since they cannot reach
# db-migrate's.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Go is here for one check in this group: checks/vector-freshness.mjs
  # runs the vector generator and compares bytes. It lives in the metadata
  # group rather than beside the Go tests because the Go test cache does
  # not track files outside the module, so a cached pass over an edited
  # vector file is exactly the window this closes.
  metadata:
    name: repo metadata (before any database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make metadata

  # The host policy on the frozen core (trust-kernel/01, decision 087):
  # force pushes and branch deletion blocked on main. Its own job, and in
  # the all-green fan-in below, so it blocks a merge. Only a query to the
  # host can say what is actually in force, which is why this cannot be a
  # file check; the rules-in-force endpoint answers for an ordinary read
  # token, so GITHUB_TOKEN is enough.
  kernel-governance:
    name: host rules in force on the frozen core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make kernel-governance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  red-paths:
    name: red-path fixtures (database stage disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make check-red

  lint:
    name: gofmt + prettier + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make lint

  db-migrate:
    name: db replay + typegen check
    needs: [metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make db-up
      # Both chains replay from empty twice; the second replay must be a
      # no-op and an independent from-empty replay must produce an
      # identical schema (layer criterion 2's mechanism).
      - run: make migrate-verify
      # Generated types are diffed against both live schemas; a table
      # edited without regenerated types fails here.
      - run: make typegen-check
      # The standing append-only proof (foundation/03): grants, default-
      # privilege inheritance, SECURITY DEFINER bodies, incompatible
      # schema pairs, checked against both live planes.
      - run: make append-only
      # The spine schema lint (foundation/04): live spine columns are
      # allow-listed domains or justified exceptions.
      - run: make spine-schema
      # The residency check (foundation/04): residency_region NOT NULL on
      # every payload table; no row disagrees with its database.
      - run: make payload-residency
      # The schema-grep check (foundation/06): no fact-table column on
      # either plane stores a capability, tier, trajectory, reliability,
      # trust, or weighting judgment about a person.
      - run: make scored-columns
      # The physical-split proof (foundation/04): distinct clusters, no
      # spanning transaction, a role catalog per plane.
      - run: make two-plane-split
      # The database-dependent red paths: planted schema drift, planted
      # grant and SECURITY DEFINER violations, and foundation/04's
      # planted lint violations (disallowed spine type, unjustified
      # exception, missing/disagreeing residency) must each fail their
      # check.
      - run: make check-red-db
      - run: make db-down

  go:
    name: go vet + test
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - run: make go-check

  # `make ts-check` carries the TypeScript half of the golden-vector check
  # (trust-kernel/01): contract/runner is a workspace package, so
  # `pnpm -r run test` runs it against contract/vectors, the same files the
  # go job runs the kernel against. Both languages exercise identical bytes
  # from the first day there is a kernel, which is what the layer's first
  # criterion asks for.
  ts:
    name: pnpm typecheck + test
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make ts-check

  # The envelope acceptance suite (foundation/05): needs a live payload
  # database AND the Go toolchain, which no existing job pairs; runs in
  # its own runner with its own Postgres pair. The header note above
  # already covers why no job can reach another's databases. Once per
  # key provider, swap by
  # configuration only (make envelope-test).
  envelope:
    name: envelope suite (both key providers)
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make db-up
      - run: make migrate
      - run: make envelope-test
      - run: make db-down

  # The cross-plane write consistency scenarios (foundation/07). Boots
  # its own Postgres pair. Per this file's header, no job can reach
  # db-migrate's, because the worker binary needs Go and the scenarios
  # need both live planes, which db-migrate's toolchain does not carry.
  # `needs: [db-migrate]` is ordering only: schema problems fail there
  # first, with the cheaper checks.
  outbox:
    name: cross-plane outbox scenarios
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make db-up
      - run: make migrate
      # The FDW/dblink ban, live half: no cross-database construct in
      # either live database (the file half runs in metadata).
      - run: make cross-plane-constructs
      # The worker driven through its kill points, manual replay, the
      # reconciler, and the stalled-payload acknowledgment proof.
      - run: make cross-plane-outbox
      - run: make db-down


  # The signup and id-issuance acceptance suite (person-identity/01).
  # Boots its own Postgres pair, because it drives both planes: the spine
  # transaction that issues an id, the outbox worker that carries the
  # payload half, and the per-person key underneath both.
  # `needs: [db-migrate]` is ordering only, as above.
  person:
    name: signup and id issuance
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make db-up
      - run: make migrate
      - run: make person-test
      - run: make db-down

  # The authentication and sessions acceptance suite (person-identity/02).
  # Its own Postgres pair, and its own job rather than a step inside the
  # signup one: it is the slowest suite in the graph, because the
  # enumeration criterion is a timing assertion and those cases sit on
  # the uniform floor by construction. Running it beside `person` rather
  # than after it keeps the wall clock roughly where it was.
  # `needs: [db-migrate]` is ordering only, as above.
  auth:
    name: authentication and sessions
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make db-up
      - run: make migrate
      - run: make auth-test
      - run: make db-down

  # The deletion-mechanics acceptance suite (foundation/08). Boots its
  # own Postgres pair. Per this file's header, no job can reach
  # db-migrate's, because the suite needs Go, Node (the backup/restore
  # scripts) and both live planes: it takes a real pg_dump backup,
  # restores it into a recreated payload container, proves the restore
  # gate refuses traffic until the journal replay, and audits a purge
  # run. `needs: [db-migrate]` is ordering only: schema problems fail
  # there first, with the cheaper checks.
  deletion:
    name: deletion mechanics (backup, restore, replay, purge)
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: make db-up
      - run: make migrate
      - run: make deletion-test
      - run: make db-down

  # Fan-in: the one status branch protection marks required, so every
  # stage above is required transitively.
  all-green:
    name: all stages green
    if: always()
    needs:
      [
        metadata,
        kernel-governance,
        red-paths,
        lint,
        db-migrate,
        go,
        ts,
        envelope,
        outbox,
        person,
        auth,
        deletion,
      ]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
