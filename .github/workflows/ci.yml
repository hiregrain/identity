# CI as a dependency graph (foundation/01). Repo-metadata checks validate
# files and need no schema, so they run before any database boots; the
# database chain then gates the language suites. Stages owned by later
# tasks (typegen --check in foundation/02, schema-dependent checks in
# foundation/04 and 06) slot into this graph when those tasks land.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  metadata:
    name: repo metadata (before any database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make metadata

  red-paths:
    name: red-path fixtures (database stage disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make check-red

  lint:
    name: gofmt + prettier + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make lint

  db-migrate:
    name: db up + migrate
    needs: [metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make db-up
      - run: make migrate
      - run: make db-down

  go:
    name: go vet + test
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - run: make go-check

  ts:
    name: pnpm typecheck + test
    needs: [db-migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make ts-check

  # Fan-in: the one status branch protection marks required, so every
  # stage above is required transitively.
  all-green:
    name: all stages green
    if: always()
    needs: [metadata, red-paths, lint, db-migrate, go, ts]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
