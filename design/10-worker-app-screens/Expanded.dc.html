<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain — DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F5F6F3; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1 — every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1 — pure separation, never a state */
      --page:#E6E6E4;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 — one family, hierarchy from width, weight and tracking */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY — never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
    /* §7 depth presses down; verified rows have zero press-give — rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons — no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:13px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:13px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    /* the plate (§9) marks the RECORD. A settings sheet is not one, so the
       corners appear on the record surface and nowhere else. */
    .plate{position:absolute;inset:0;pointer-events:none}
    .reg{position:absolute;width:11px;height:11px;border:0 solid var(--rule)}
    .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
         border-bottom:1px solid var(--hairline);width:100%}
    .row-sel{border-bottom:1.5px solid var(--rule)}
    .gutter{flex:0 0 26px;padding-top:3px}
    .sechead{display:flex;justify-content:space-between;align-items:baseline;
             border-bottom:1px solid var(--ink);padding-bottom:8px;gap:12px}
    .icon{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:square}
    .col-r{text-align:right;white-space:nowrap;padding-top:1px}
    main::-webkit-scrollbar{width:0}

    .stage{touch-action:none;cursor:grab;overflow:hidden}
    .stage:active{cursor:grabbing}
    /* the resting state is VISIBLE. The scribe is added on open and removed when
       it finishes, so an environment that suppresses animation still shows the
       figure (design/07 §5). */
    .opening .ch path, .opening .ch circle{stroke-dasharray:1;stroke-dashoffset:1;
      animation:scribe 760ms cubic-bezier(0.2,0,0,1) forwards}
    .opening .ch1 path,.opening .ch1 circle{animation-delay:60ms}
    .opening .ch2 path,.opening .ch2 circle{animation-delay:120ms}
    .opening .ch3 path,.opening .ch3 circle{animation-delay:180ms}
    .opening .ch4 path,.opening .ch4 circle{animation-delay:240ms}
    @keyframes scribe{to{stroke-dashoffset:0}}
    /* unselected chapters recede to 3.4:1, not to invisibility. Selection is not
       provenance, so recession here does not collide with law 8. */
    .ch{transition:opacity 220ms cubic-bezier(0.2,0,0,1)}
    .sel0 .ch,.sel1 .ch,.sel2 .ch,.sel3 .ch,.sel4 .ch{opacity:.55}
    .sel0 .ch0,.sel1 .ch1,.sel2 .ch2,.sel3 .ch3,.sel4 .ch4{opacity:1}
    .pick{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
    .pick::-webkit-scrollbar{height:0}
    .pick button{min-height:44px;padding:12px 12px;white-space:nowrap;
                 border-bottom:2px solid transparent}
    .pick button[aria-pressed="true"]{border-bottom-color:var(--ink)}
    .zoom{display:flex;height:44px;align-items:flex-end}
    .zoom button{flex:1;height:44px;display:flex;align-items:flex-end;justify-content:center}
    .zoom i{display:block;width:1px;background:var(--rule)}
    .lrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
    .lmark{flex:0 0 20px;margin-top:8px}
  </style>
</helmet>

  componentDidMount(){ this._t = setTimeout(() => this.setState({phase:''}), 1100); }
  componentWillUnmount(){ clearTimeout(this._t); }

  toModel(e){
    const box = e.currentTarget.getBoundingClientRect();
    const side = Math.min(box.width, box.height);
    const ox = box.left + (box.width-side)/2, oy = box.top + (box.height-side)/2;
    const sx = ((e.clientX-ox)/side)*600, sy = ((e.clientY-oy)/side)*600;
    const k = ZOOMS[this.state.z];
    return {x: ((sx - this.state.tx - 300*(1-k))/k - 300)/S,
            y: ((sy - this.state.ty - 300*(1-k))/k - 300)/S};
  }
  down(e){
    if(e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
    this.setState({dragging:true, moved:0, px:e.clientX, py:e.clientY});
  }
  move(e){
    if(!this.state.dragging) return;
    const dx = e.clientX-this.state.px, dy = e.clientY-this.state.py;
    const box = e.currentTarget.getBoundingClientRect();
    const k = 600/Math.min(box.width, box.height);
    this.setState({tx:this.state.tx+dx*k, ty:this.state.ty+dy*k, px:e.clientX, py:e.clientY,
                   moved:this.state.moved+Math.abs(dx)+Math.abs(dy)});
  }
  up(e){
    const wasDrag = this.state.moved > 6;
    this.setState({dragging:false});
    if(wasDrag) return;
    const {x,y} = this.toModel(e);
    const r = Math.hypot(x,y);
    let t = Math.atan2(y,x); if(t<0) t += TAU;
    const dim = Math.round(t/(TAU/LOBES)) % LOBES;
    let ch = this.state.ch, best = Infinity;
    CHAPTERS.forEach((c,i) => {                       // clamp to the nearest
      const d = r < c.r0 ? c.r0 - r : (r > c.r1 ? r - c.r1 : 0);
      if(d < best){ best = d; ch = i; }
    });
    this.setState({dim, ch});
  }
  profile(levels){
    return (t) => {
      const u = ((t % TAU) + TAU) % TAU / (TAU/LOBES);
      const i = Math.floor(u), f = u - i;
      const a = levels[i % LOBES]/6, b = levels[(i+1) % LOBES]/6;
      return FLOOR + (1-FLOOR)*(a + (b-a)*(0.5 - 0.5*Math.cos(Math.PI*f)));
    };
  }

  renderVals(){
    const {dim, ch, z, tx, ty} = this.state;
    const c = CHAPTERS[ch], D = DIMS[dim], k = ZOOMS[z];
    const t0 = dim*(TAU/LOBES);
    const P = (r, ang) => [300 + r*S*Math.cos(ang), 300 + r*S*Math.sin(ang)];
    const line = (r1, r2, ang) => { const [x1,y1]=P(r1,ang), [x2,y2]=P(r2,ang);
      return `M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}`; };
    const level = c.levels ? c.levels[dim] : null;
    const mid = (c.r0+c.r1)/2, amp = (c.r1-c.r0)/2 - STROKE;

    let lobe = '', marks = [];
    if(level !== null){
      const L = this.profile(c.levels), pts = [];
      for(let i=0;i<=48;i++){
        const t = t0 - Math.PI/LOBES + (TAU/LOBES)*(i/48);
        const [x,y] = P(mid + amp*L(t)*Math.sin(LOBES*t + Math.PI/2), t);
        pts.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
      }
      lobe = 'M' + pts.join(' L');
      for(let lv=0; lv<=6; lv++){
        const [x,y] = P(mid + amp*(FLOOR + (1-FLOOR)*(lv/6)), t0);
        const g = lv===level ? 1.9 : 1, nx = -Math.sin(t0)*8*g, ny = Math.cos(t0)*8*g;
        marks.push({d:`M${(x-nx).toFixed(1)} ${(y-ny).toFixed(1)} L${(x+nx).toFixed(1)} ${(y+ny).toFixed(1)}`,
                    w: lv===level ? 2.8 : 0.9, o: lv===level ? 1 : (lv<level ? .8 : .55)});
      }
    }

    return {
      down:(e)=>this.down(e), move:(e)=>this.move(e), up:(e)=>this.up(e),
      phase: this.state.phase, selCls: 'sel' + ch,
      figureAlt: `Imprint. Showing ${D.n} on ${c.party}.`,
      view: `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) translate(${(300*(1-k)).toFixed(1)} ${(300*(1-k)).toFixed(1)}) scale(${k})`,
      sectorA: line(44, 300, t0 - Math.PI/LOBES),
      sectorB: line(44, 300, t0 + Math.PI/LOBES),
      spoke: line(44, 300, t0),
      selR0: (c.r0*S).toFixed(1), selR1: (c.r1*S).toFixed(1),
      hasLevel: level !== null, lobe, levelMarks: marks,
      dimension: D.n, definition: D.d,
      levelLabel: level === null ? 'Nothing attested' : (level === 0 ? 'Not part of this work' : 'One of seven'),
      ladder: D.a.map((text, lv) => ({
        text,
        weight: lv === level ? '600' : '400',
        size:   lv === level ? '15px' : '13px',
        h:      lv === level ? '2px' : '1px',
        markColor: level === null ? 'var(--hairline)' : (lv === level ? 'var(--ink)' : 'var(--rule)'),
        border: lv === level ? 'var(--ink)' : 'var(--hairline)'
      })),
      setBy: c.setBy, caveat: level === null ? '' : CAVEAT, party: c.party, span: c.span,
      chapterPicks: CHAPTERS.map((x,i) => ({label:x.short, on: i===ch ? 'true':'false',
        go: () => this.setState({ch:i})})),
      dimPicks: DIMS.map((x,i) => ({label:x.s, on: i===dim ? 'true':'false',
        go: () => this.setState({dim:i})})),
      ticks: ZOOMS.map((v,i) => ({label: v + ' times', on: i===z ? 'true':'false',
        h: i===z ? '20px' : '10px', c: i<=z ? 'var(--ink)' : 'var(--rule)',
        go: () => this.setState({z:i, tx: i===0 ? 0 : this.state.tx, ty: i===0 ? 0 : this.state.ty})})),
      zoomLabel: k + '×'
    };
  }
}
</script>
