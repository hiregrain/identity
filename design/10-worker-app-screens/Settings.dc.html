<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain — DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F5F6F3; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1 — every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1 — pure separation, never a state */
      --page:#E6E6E4;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 — one family, hierarchy from width, weight and tracking */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY — never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
    /* §7 depth presses down; verified rows have zero press-give — rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons — no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:13px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:13px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    /* the plate (§9) marks the RECORD. A settings sheet is not one, so the
       corners appear on the record surface and nowhere else. */
    .plate{position:absolute;inset:0;pointer-events:none}
    .reg{position:absolute;width:11px;height:11px;border:0 solid var(--rule)}
    .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
         border-bottom:1px solid var(--hairline);width:100%}
    .row-sel{border-bottom:1.5px solid var(--rule)}
    .gutter{flex:0 0 26px;padding-top:3px}
    .sechead{display:flex;justify-content:space-between;align-items:baseline;
             border-bottom:1px solid var(--ink);padding-bottom:8px;gap:12px}
    .icon{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:square}
    .col-r{text-align:right;white-space:nowrap;padding-top:1px}
    main::-webkit-scrollbar{width:0}

    .srow{display:flex;gap:12px;align-items:baseline;padding:13px 0;
          border-bottom:1px solid var(--hairline);width:100%;min-height:44px}
    .grp{padding-top:24px}
    main::-webkit-scrollbar{width:0}
  </style>
</helmet>

<div style="width:360px;height:800px;position:relative;overflow:hidden;background:var(--paper)">
  <header style="height:52px;display:flex;align-items:center;justify-content:space-between;
                 padding:0 20px;border-bottom:1px solid var(--hairline);position:relative;z-index:3;
                 background:var(--paper)">
    <h1 class="t-serial" style="margin:0">Account</h1>
    <button class="press" aria-label="Close" style="width:44px;height:44px;display:flex;
            align-items:center;justify-content:flex-end">
      <svg width="18" height="18" viewBox="0 0 18 18" class="icon"><path d="M3 3 L15 15"/><path d="M15 3 L3 15"/></svg>
    </button>
  </header>

  <main style="position:absolute;top:52px;bottom:26px;left:0;right:0;overflow-y:auto;padding:0 20px 40px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
      <div class="grp">
        <h2 class="t-micro" style="display:block;color:var(--secondary);padding-bottom:6px;
                                   border-bottom:1px solid var(--ink);margin:0">{{ g.name }}</h2>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="5">
          <sc-if value="{{ r.act }}" hint-placeholder-val="{{ true }}">
            <button class="srow press" onClick="{{ r.act }}">
              <span class="t-body" style="flex:1;min-width:0">{{ r.label }}</span>
              <span class="t-data" style="text-align:right;color:var(--secondary)">{{ r.value }}</span>
            </button>
          </sc-if>
          <sc-if value="{{ r.inert }}" hint-placeholder-val="{{ true }}">
            <div class="srow">
              <span class="t-body" style="flex:1;min-width:0;color:var(--secondary)">{{ r.label }}</span>
              <span class="t-data" style="text-align:right">{{ r.value }}</span>
            </div>
          </sc-if>
        </sc-for>
        <sc-if value="{{ g.note }}" hint-placeholder-val="{{ true }}">
          <p class="t-meta" style="margin:10px 0 0;color:var(--secondary);text-wrap:pretty">{{ g.note }}</p>
        </sc-if>
      </div>
    </sc-for>

    <div style="padding-top:28px">
      <button class="btn-secondary press" onClick="{{ toggle }}">Ask us to delete everything</button>
      <sc-if value="{{ confirming }}" hint-placeholder-val="{{ true }}">
        <div style="background:var(--ink);color:var(--paper);padding:16px;margin-top:12px">
          <p class="t-body" style="margin:0;text-wrap:pretty">Support handles this. Nobody can read
            your record from the moment you ask. Everything is erased seven days later. If you sign in
            before then it all comes back, and you would have to ask again.</p>
        </div>
        <div style="padding-top:12px;text-align:center">
          <button class="btn-tertiary press" onClick="{{ toggle }}">Keep my record</button>
        </div>
      </sc-if>
    </div>
  </main>

  <footer style="position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;
                 align-items:center;justify-content:space-between;padding:0 20px;
                 border-top:1px solid var(--hairline);background:var(--paper);z-index:2">
    <span class="t-micro" style="color:var(--secondary)">Grain</span>
    <span class="t-data" style="color:var(--secondary);font-size:11px">Version 1.0</span>
  </footer>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
// A sheet from the Record header, not a destination. Read-only: every account
// change is a support request (decision 030). Deletion has no in-app control —
// it is named here and routed, because consent promises the right at signup.
class Component extends DCLogic {
  constructor(p){ super(p); this.state = {confirming:false}; }
  renderVals(){
    const inert = (label, value) => ({label, value, inert:true});
    const act = (label, value) => ({label, value, act: () => {}});
    return {
      groups: [
        {name:'Account', rows:[
          inert('Full name','Liezel Mendoza'), inert('Phone','+63 •• ••• 4471'),
          inert('Email','Not added'), inert('Address','hiregrain.com/u/liezel-mendoza')],
         note:'Support changes any of these. Message us and we will do it.'},
        {name:'Identity', rows:[
          act('Identity verification','Document'),
          act('Add a liveness check','Not added')],
         note:'Employers see one thing: verified, or not. They never see the document.'},
        {name:'Notifications', rows:[
          act('A business signs your work','On'),
          act('A grant is about to end','On'),
          act('Your public page is viewed','Off')]},
        {name:'Language', rows:[ act('App language','English') ]},
        {name:'Your data', rows:[
          act('Send me everything','By email, within 24 hours'),
          act('Who can read my record','2 parties'),
          act('Who has read my record','Ask us')]},
        {name:'About', rows:[ act('How the record works',''), act('Terms',''), act('Privacy','') ]}
      ],
      confirming: this.state.confirming,
      toggle: () => this.setState({confirming: !this.state.confirming})
    };
  }
}
</script>
</body>
</html>
