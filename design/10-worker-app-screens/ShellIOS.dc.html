<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain, per DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F8F5EE; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1, every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1, pure separation, never a state */
      --page:#E9E5DE;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 uses one family, hierarchy from width, weight and tracking */
    /* Two registers added because the screens were already asking for them in
       inline overrides: t-lead at 19 appeared twelve times patching t-sec
       upward for a statement that opens a screen, and t-head at 25 appeared
       eleven times patching t-title downward for a pushed screen, where a 28px
       title next to a 52px header band reads as a second masthead. Adding two
       registers is a smaller change than thirty-two local patches, and it is
       the only one a check can hold. */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-head  {font-stretch:110%;font-weight:700;font-size:25px;line-height:1.16;text-wrap:balance}
    .t-lead  {font-weight:600;font-size:19px;line-height:1.35;text-wrap:pretty}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY, never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
    /* §7 depth presses down. Verified rows have zero press-give, and rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons have no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:12px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:12px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    /* iPhone 17, 402x874 pt at 3x, status bar 54, safe area top 62, bottom 34.
       The frame is drawn from those published metrics. The insets are reserved
       and measured, never simulated: no clock, no battery, no home-bar glyph,
       because a real device draws its own into exactly that space. */
    .body{position:absolute;top:0;left:0;right:0;border-radius:66px;background:var(--ink);
          box-shadow:inset 0 0 0 2px var(--secondary)}
    .screen{position:absolute;top:12px;left:12px;width:402px;height:874px;
            border-radius:55px;overflow:hidden;background:var(--paper)}
    .island{position:absolute;top:14px;left:50%;transform:translateX(-50%);
            width:126px;height:37px;border-radius:19px;background:var(--ink);z-index:6}
    .inset{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;
           justify-content:center;
           background:repeating-linear-gradient(-45deg,var(--page) 0 6px,var(--paper) 6px 12px)}
    .inset span{background:var(--paper);padding:2px 6px}
    .rule{position:absolute;left:0;right:0;border-top:1px solid var(--rule);z-index:5}
  </style>
</helmet>

<div style="width:426px;height:990px;position:relative;background:var(--page)">
  <div class="body" style="height:898px"></div>

  <div class="screen">
    <!-- 62 pt of safe-area top: the status bar and the Dynamic Island live here -->
    <div class="inset" style="top:0;height:62px">
      <span class="t-micro" style="color:var(--secondary)">safe-area-inset-top · 62 pt</span>
    </div>
    <div class="rule" style="top:62px"></div>

    <!-- No band drawn over the home indicator: that space belongs to the
         system, and hatching it reads as a boundary the app owns.
    What iOS actually leaves a screen: 874 - 62 - 34 -->
    <!-- Exactly what iOS leaves, and the app fills it. It used to be a fixed
         360px column centred in 402, which left 42 pt of the display dead. -->
    <div style="position:absolute;top:62px;bottom:34px;left:0;right:0;overflow:hidden">
        <dc-import name="Main" hint-size="100%,100%"></dc-import>
    </div>


    <div class="island"></div>
  </div>

  <!-- Measurements sit BELOW the device. They were drawn inside it, over the app. -->
  <div style="position:absolute;left:0;right:0;top:918px;display:flex;flex-direction:column;gap:3px">
    <span class="t-micro" style="color:var(--secondary)">iPhone 17 · 402 × 874 pt @3x</span>
    <span class="t-data" style="font-size:12px">{{ verdictH }}</span>
    <span class="t-data" style="font-size:12px">{{ verdictW }}</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>
// iPhone 17, from the published metrics rather than memory: 402x874 pt at 3x,
// status bar 54 pt, portrait safe area top 62 / bottom 34 / left 0 / right 0.
const DEVICE = {w:402, h:874, top:62, bottom:34};
const DRAWN  = {w:360, h:800};
class Component extends DCLogic {
  renderVals(){
    const usableH = DEVICE.h - DEVICE.top - DEVICE.bottom;   // 778
    const overH = DRAWN.h - usableH;
    const spareW = DEVICE.w - DRAWN.w;
    return {
      verdictH: overH > 0 ? overH + ' pt too tall' : Math.abs(overH) + ' pt to spare',
      verdictW: spareW > 0 ? spareW + ' pt of width unused' : 'width fits'
    };
  }
}
</script>
</body>
</html>
