<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain — DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F8F5EE; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1 — every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1 — pure separation, never a state */
      --page:#E9E5DE;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 — one family, hierarchy from width, weight and tracking */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY — never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
    /* §7 depth presses down; verified rows have zero press-give — rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons — no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:13px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:13px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    /* the plate (§9) marks the RECORD. A settings sheet is not one, so the
       corners appear on the record surface and nowhere else. */
    .plate{position:absolute;inset:0;pointer-events:none}
    .reg{position:absolute;width:11px;height:11px;border:0 solid var(--rule)}
    .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
         border-bottom:1px solid var(--hairline);width:100%}
    .row-sel{border-bottom:1.5px solid var(--rule)}
    .gutter{flex:0 0 26px;padding-top:3px}
    .sechead{display:flex;justify-content:space-between;align-items:baseline;
             border-bottom:1px solid var(--ink);padding-bottom:8px;gap:12px}
    .icon{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:square}
    .col-r{text-align:right;white-space:nowrap;padding-top:1px}
    main::-webkit-scrollbar{width:0}

    /* §9's sine-modulated divider and the rung scale live in the chassis, not in
       one screen's helmet: both are shared vocabulary, and a class defined in
       Main only meant every other screen rendered them unstyled. */
    .sinerule{margin-top:-1px;line-height:0;opacity:.9}
    .rung{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
    .rung i{display:block;width:3px}
    /* The imprint is capped and centred wherever it appears. A fluid root with an
       uncapped figure grows until the figure swallows the display — the defect
       fixed on the record and still live on three other screens. 320 is the size
       it is drawn and thread-budgeted at (044). */
    .imprint{display:block;width:100%;max-width:320px;margin-inline:auto}
    /* An instrument reading: the figure and what it counts. baseline alignment
       hung the small text off the numeral's foot, which reads as two things that
       missed each other. The text block is centred against the numeral instead,
       and the numeral gets its own optical trim — a 40px 800-weight Expanded
       figure sits high in its line box. */
    .reading{display:flex;align-items:center;gap:14px}
    .reading .t-inst{flex:0 0 auto;line-height:.82;position:relative;top:1px}
    .reading > span:last-child{flex:1;min-width:0}
    /* A row that goes somewhere says so. Rows that only state a fact carry no
       chevron — a fact dressed as a control lies about what can be changed. */
    .chev{flex:0 0 16px;display:flex;align-items:center;padding-left:4px}
    /* The bottom of a scroller is where the system's own bar begins. Content that
       simply stops there reads as cut off, and a large empty band reads as a
       mistake. `.dissolve` fades the last 28px of the scroll into the paper, so
       the record ends rather than being truncated, and the home indicator has
       something to sit against. 28 is the smallest band that reads as intentional
       at the 16px body size — below that it is a hairline nobody sees. */
    .dissolve{-webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 28px), transparent 100%);
              mask-image:linear-gradient(to bottom, #000 calc(100% - 28px), transparent 100%)}
    @media (prefers-reduced-transparency:reduce){
      .dissolve{-webkit-mask-image:none;mask-image:none}
    }

    /* §8 inputs are ruled lines: a hairline you type on, focus thickens ink-ward.
       An error thickens it further and speaks in ink — never paler (law 8). */
    .ruled{display:flex;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:10px}
    .ruled:focus-within{border-bottom:2px solid var(--ink)}
    .ruled.bad{border-bottom:2.5px solid var(--ink)}
    /* WCAG 2.2 AA 2.5.8 and §12's stricter 44px floor: the field is the target,
       and it measured 18px tall. The rule stays a rule; the touchable area is
       padded around it. */
    .ruled input{border:0;outline:0;background:none;font:inherit;color:var(--ink);
                 flex:1;min-width:0;padding:12px 0;font-weight:600;font-size:16px;
                 min-height:44px;box-sizing:border-box}
    .ruled{align-items:center}
    .alt{min-height:44px;padding:13px 12px;border:1px solid var(--rule);border-radius:0}
  </style>
</helmet>

<!-- Fluid in both axes: the record fills whatever safe area it is given, and
     min-height carries the standalone case where height:100% has no sized
     ancestor and would collapse to zero. 728 is the common safe box across
     iOS (778) and Android (728). Decision 046. -->
<div style="width:100%;height:100%;min-height:752px;position:relative;overflow:hidden;background:var(--paper)">
  <header style="height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;
                 border-bottom:1px solid var(--hairline)">
    <!-- The lockup: mark plus the GRAIN wordmark (§4a), generated so the mark
         swaps to its drawn reduction rather than scaling a master. -->
    <svg viewBox="0 0 160 26" width="160" height="26" role="img" aria-label="Grain"><svg x='0' y='0' width='26.00' height='26.00' viewBox='0 0 600 600'><g fill='none' stroke='#1B2A44' stroke-width='28.85'><path d='M564.00 300.00 L584.44 333.88 L586.74 369.29 L565.95 398.78 L529.42 417.75 L492.65 429.76 L470.47 446.91 L465.16 480.54 L462.52 526.50 L445.69 564.26 L412.09 576.40 L372.28 564.53 L336.52 544.65 L306.92 533.31 L278.76 538.27 L246.36 554.85 L209.17 568.68 L173.56 565.42 L147.91 540.91 L134.78 503.62 L127.29 467.66 L113.74 442.19 L87.12 425.73 L51.95 409.27 L22.38 384.78 L12.19 351.73 L24.39 316.36 L48.54 285.08 L68.13 258.33 L72.64 230.57 L64.85 196.42 L58.25 157.23 L66.57 121.80 L93.86 99.88 L132.54 93.62 L170.23 94.43 L199.36 88.73 L221.72 68.46 L244.89 38.19 L274.39 12.76 L308.69 6.77 L341.23 23.80 L367.28 53.79 L389.04 80.45 L414.04 93.15 L447.82 93.99 L487.44 95.10 L521.90 108.76 L540.00 138.35 L539.59 177.03 L530.41 214.41 L527.56 245.01 L540.14 271.40 L564.00 300.00 Z'/><path d='M472.00 300.00 L502.50 326.66 L505.12 354.96 L474.49 372.28 L428.29 374.07 L395.48 373.26 L393.79 393.79 L409.22 442.34 L409.74 490.08 L383.80 502.31 L347.64 477.78 L319.01 444.41 L300.00 430.65 L280.76 446.11 L252.79 476.17 L220.03 493.08 L196.68 478.96 L192.11 440.60 L198.38 401.62 L195.01 380.56 L168.36 376.00 L126.95 371.68 L96.54 354.52 L98.01 326.59 L128.00 300.00 L160.93 281.69 L171.18 265.48 L155.23 240.04 L133.72 204.00 L132.08 171.15 L158.38 158.38 L198.47 167.69 L231.32 181.04 L248.32 175.23 L258.16 143.86 L274.37 105.33 L300.00 88.00 L325.63 105.33 L341.84 143.86 L351.68 175.23 L368.68 181.04 L401.53 167.69 L441.62 158.38 L467.92 171.15 L466.28 204.00 L444.76 240.04 L428.81 265.49 L439.03 281.70 L472.00 300.00 Z'/><path d='M390.00 300.00 L406.81 314.06 L408.37 329.04 L391.72 337.99 L366.58 338.44 L348.86 337.49 L348.33 348.33 L357.27 374.63 L358.06 400.56 L344.33 407.02 L325.01 393.34 L309.86 374.86 L300.00 367.25 L290.02 375.80 L275.23 392.45 L257.77 401.94 L245.47 394.44 L243.46 373.68 L247.36 352.64 L245.90 341.51 L231.58 339.50 L209.07 337.66 L192.54 328.79 L193.47 314.03 L210.00 300.00 L228.07 290.53 L233.59 282.21 L224.63 268.78 L212.53 249.50 L211.29 231.93 L225.36 225.36 L246.96 230.88 L264.53 238.56 L273.34 235.63 L278.18 218.57 L286.50 197.49 L300.00 188.00 L313.50 197.49 L321.82 218.57 L326.66 235.63 L335.47 238.56 L353.04 230.88 L374.64 225.36 L388.71 231.93 L387.47 249.50 L375.37 268.78 L366.40 282.21 L371.91 290.53 L390.00 300.00 Z'/></g></svg><text x='39.93' y='21.96' font-family='Archivo' font-size='26.92' font-weight='600' font-stretch='125%' letter-spacing='2.42' fill='#1B2A44'>GRAIN</text></svg>
  </header>

  <main class="dissolve" style="position:absolute;top:52px;bottom:120px;left:0;right:0;overflow-y:auto;padding:28px 20px">
    <h1 class="t-title" style="margin:0 0 8px">Your link</h1>
    <p class="t-body" style="margin:0 0 32px;color:var(--secondary);text-wrap:pretty">
      The address people open to see your record. We wrote it out from your name.
    </p>

    <label class="t-micro" for="h" style="display:block;color:var(--secondary);padding-bottom:8px">Address</label>
    <div class="ruled {{ cls }}">
      <span class="t-data" style="color:var(--secondary)">hiregrain.com/u/</span>
      <input id="h" value="{{ value }}" onInput="{{ onInput }}" aria-describedby="hn"
             aria-invalid="{{ invalid }}" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
    <p id="hn" class="t-data" style="margin:12px 0 0;color:var(--ink)">{{ note }}</p>

    <sc-if value="{{ suggest }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:16px">
        <sc-for list="{{ alternates }}" as="a" hint-placeholder-count="3">
          <button class="alt t-data press" onClick="{{ a.pick }}">{{ a.h }}</button>
        </sc-for>
      </div>
    </sc-if>

    <div style="margin-top:40px;border-top:1px solid var(--hairline);padding-top:16px">
      <p class="t-body" style="margin:0;color:var(--secondary);text-wrap:pretty">
        You can change this later. The old address keeps working and never goes to anyone
        else, so anyone who already has it keeps reaching you.
      </p>
    </div>
  </main>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 20px;background:var(--paper);
              border-top:1px solid var(--ink)">
    <button class="btn-primary press" disabled="{{ disabled }}">Claim this address</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
// Handle claim, in onboarding, after the record exists (029). Latin-only URLs
// (029 §A), so a non-Latin name is TRANSLITERATED into a working address and
// never rejected — design/07 §5 found the first build only claimed to do this.
const MAP = {
  // Devanagari, Bengali, Arabic, Cyrillic, Greek, Han, Kana — enough to show the
  // mechanism. Production uses ICU; this is the mockup's stand-in.
  'ল':'l','ি':'i','য':'y','া':'a','জ':'j','ে':'e','ল':'l','ম':'m','ন':'n','্':'','দ':'d','ো':'o','স':'s',
  'л':'l','и':'i','з':'z','е':'e','м':'m','н':'n','д':'d','о':'o','с':'s','а':'a','р':'r','в':'v','к':'k',
  'α':'a','β':'b','γ':'g','δ':'d','ε':'e','λ':'l','μ':'m','ν':'n','ο':'o','σ':'s','τ':'t','ρ':'r','ι':'i'
};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = {value:'liezel-mendoza'}; }
  translit(v){
    return Array.from(v || '').map(ch => MAP[ch] !== undefined ? MAP[ch] : ch).join('');
  }
  normalize(v){
    return this.translit(v).normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  }
  renderVals(){
    const raw = this.state.value, h = this.normalize(raw);
    const taken = h === 'liezel' || h === 'mendoza';
    const short = h.length > 0 && h.length < 3, empty = h.length === 0;
    const ok = !taken && !short && !empty;
    return {
      value: raw,
      onInput: (e) => this.setState({value: e.target.value}),
      cls: ok ? '' : 'bad',
      invalid: ok ? 'false' : 'true',
      note: empty ? 'Type an address, or take one of these.'
          : short ? 'Make it a little longer.'
          : taken ? 'Someone already has that one. These are free.'
          : 'hiregrain.com/u/' + h + ' is free.',
      suggest: !ok,
      alternates: ['liezel-mendoza','mendoza-liezel','liezelm'].map(x => ({h:x, pick: () => this.setState({value:x})})),
      disabled: ok ? null : 'disabled'
    };
  }
}
</script>
</body>
</html>
