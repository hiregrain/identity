<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain — DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F8F5EE; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1 — every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1 — pure separation, never a state */
      --page:#E9E5DE;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 — one family, hierarchy from width, weight and tracking */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY — never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
    /* §7 depth presses down; verified rows have zero press-give — rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons — no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:13px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:13px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    .plate{position:absolute;inset:0;pointer-events:none}
    .reg{position:absolute;width:11px;height:11px;border:0 solid var(--ink);opacity:.55}
    .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
         border-bottom:1px solid var(--hairline);width:100%}
    .gutter{flex:0 0 26px;padding-top:3px}
    .proud{transform:translateY(-2px)}
    main::-webkit-scrollbar{width:0}
  </style>
</helmet>

<!-- Fluid in both axes: the record fills whatever safe area it is given, and
     min-height carries the standalone case where height:100% has no sized
     ancestor and would collapse to zero. 728 is the common safe box across
     iOS (778) and Android (728). Decision 046. -->
<div style="width:100%;height:100%;min-height:728px;position:relative;overflow:hidden;background:var(--paper)">

  <header style="height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;
                 border-bottom:1px solid var(--hairline);position:relative;z-index:2;background:var(--paper)">

         swaps to its drawn reduction rather than scaling a master. -->

47 394.44 L243.46 373.68 L247.36 352.64 L245.90 341.51 L231.58 339.50 L209.07 337.66 L192.54 328.79 L193.47 314.03 L210.00 300.00 L228.07 290.53 L233.59 282.21 L224.63 268.78 L212.53 249.50 L211.29 231.93 L225.36 225.36 L246.96 230.88 L264.53 238.56 L273.34 235.63 L278.18 218.57 L286.50 197.49 L300.00 188.00 L313.50 197.49 L321.82 218.57 L326.66 235.63 L335.47 238.56 L353.04 230.88 L374.64 225.36 L388.71 231.93 L387.47 249.50 L375.37 268.78 L366.40 282.21 L371.91 290.53 L390.00 300.00 Z'/></g></svg><text x='39.93' y='21.96' font-family='Archivo' font-size='26.92' font-weight='600' font-stretch='125%' letter-spacing='2.42' fill='#1B2A44'>GRAIN</text></svg>
  </header>

  <main style="position:absolute;top:52px;bottom:196px;left:0;right:0;overflow-y:auto;padding:0 20px 24px">
    <section style="padding-top:20px">
      <svg viewBox="0 0 600 600" width="100%" role="img"
           aria-label="Five chapters, none confirmed"><g fill='none' stroke='#1B2A44' stroke-width='1.00' vector-effect='non-scaling-stroke'><circle cx='300.0' cy='300.0' r='76.7' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/><circle cx='300.0' cy='300.0' r='114.0' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/><circle cx='300.0' cy='300.0' r='138.9' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/><circle cx='300.0' cy='300.0' r='151.4' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/><circle cx='300.0' cy='300.0' r='176.3' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/><circle cx='300.0' cy='300.0' r='217.8' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/><circle cx='300.0' cy='300.0' r='260.3' fill='none' stroke='#1B2A44' stroke-width='1.40' vector-effect='non-scaling-stroke' stroke-dasharray='3.5 5'/></g></svg>
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 0">
        <span class="t-micro" style="color:var(--secondary)">Liezel Mendoza</span>
        <span class="t-micro">5 chapters · none attested</span>
      </div>
    </section>

    <section style="padding-top:32px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;
                  border-bottom:1px solid var(--ink);padding-bottom:8px">
        <h2 class="t-sec" style="margin:0">Outstanding verification</h2>
        <span class="t-meta" style="color:var(--secondary)">5</span>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <button class="row proud press">
          <span class="gutter">
            <svg viewBox="0 0 34 16" width="34" height="16" fill="none"
                 stroke="var(--ink)" stroke-width="1"><use href="#sw-self"></use></svg>
          </span>
          <span style="flex:1;min-width:0">
            <span class="t-rec" style="display:block">{{ r.party }}</span>
            <span class="t-meta" style="display:block;color:var(--secondary);padding-top:2px">{{ r.kind }}</span>
          </span>
          <span class="t-micro" style="text-align:right;white-space:nowrap;padding-top:2px">{{ r.span }}</span>
        </button>
      </sc-for>
    </section>
  </main>

  <!-- résumé-parsed chapters need the worker's confirmation before commit (schema §2) -->
  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 20px;background:var(--paper);
              border-top:1px solid var(--ink);z-index:2">
    <p class="t-body" style="margin:0 0 12px;text-wrap:pretty">
      Read from your résumé. Nothing here is confirmed, and none of it counts until it is.</p>
    <button class="btn-primary press">Commit these 5 chapters</button>
  </div>

</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="sw-self"><path d='M0 8.0 L34.0 8.0' stroke-dasharray='3 4'/></g>
</defs></svg>
</x-dc>

    ]};
  }
}
</script>
