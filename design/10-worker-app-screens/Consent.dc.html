<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain — DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F8F5EE; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1 — every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1 — pure separation, never a state */
      --page:#E9E5DE;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 — one family, hierarchy from width, weight and tracking */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY — never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
    /* §7 depth presses down; verified rows have zero press-give — rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons — no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:13px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:13px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    /* the plate (§9) marks the RECORD. A settings sheet is not one, so the
       corners appear on the record surface and nowhere else. */
    .plate{position:absolute;inset:0;pointer-events:none}
    .reg{position:absolute;width:11px;height:11px;border:0 solid var(--rule)}
    .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
         border-bottom:1px solid var(--hairline);width:100%}
    .row-sel{border-bottom:1.5px solid var(--rule)}
    .gutter{flex:0 0 26px;padding-top:3px}
    .sechead{display:flex;justify-content:space-between;align-items:baseline;
             border-bottom:1px solid var(--ink);padding-bottom:8px;gap:12px}
    .icon{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:square}
    .col-r{text-align:right;white-space:nowrap;padding-top:1px}
    main::-webkit-scrollbar{width:0}

    .terms{list-style:none;margin:0;padding:0}
    .terms li{padding:16px 0;border-bottom:1px solid var(--hairline)}
  </style>
</helmet>

      Seven things, all of them true before you add anything. A <b>chapter</b> is one job
      or engagement with one business.</p>

    <ol class="terms">
      <sc-for list="{{ terms }}" as="t" hint-placeholder-count="7">
        <li>
          <span class="t-rec" style="display:block">{{ t.head }}</span>
          <span class="t-body" style="display:block;color:var(--secondary);padding-top:4px;text-wrap:pretty">{{ t.body }}</span>
        </li>
      </sc-for>
    </ol>

    <div style="padding-top:12px">
      <button class="btn-tertiary press" style="padding-left:0">Read the full text</button>
    </div>
  </main>

  <div style="position:absolute;left:0;right:0;bottom:26px;padding:16px 20px;background:var(--paper);
              border-top:1px solid var(--ink)">
    <button class="btn-primary press">Agree and continue</button>
  </div>

  <footer style="position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;
                 align-items:center;justify-content:space-between;padding:0 20px;
                 border-top:1px solid var(--hairline)">
    <span class="t-micro" style="color:var(--secondary)">Grain</span>
    <span class="t-micro" style="color:var(--secondary)">No record yet</span>
  </footer>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
// One instrument, the mechanics of ledger-design 0.1 §8.2, in the ledger grammar.
// Row 5 is the exit, at the same weight as the rest. Row 7 added per design/07
// §5: parties place you on seven set measures and nothing here said so.
class Component extends DCLogic {
  renderVals(){
    return { terms: [
      {head:'Businesses write about your work',
       body:'A business you worked for signs a record of what you did. It is permanent, and you cannot edit it.'},
      {head:'Asking for confirmation cannot be undone',
       body:'Once you ask a business to confirm a chapter, that record is permanent for as long as your profile exists.'},
      {head:'You choose who reads, never what they read',
       body:'Anyone you give access to reads your whole record: every chapter, everything each business wrote, and your imprint. There is no way to show them part of it. Every grant has an end date, and they can pay us to analyse what they read.'},
      {head:'Businesses describe your work on seven set measures',
       body:'They pick a description on each one, and Grain turns that into a level. It travels with your record to anyone you share it with, and onto your public page if you turn the imprint on.'},
      {head:'You can attach your side to anything',
       body:'The record stays as the business wrote it. Grain checks that they really signed it, never whether they were fair, and they can decline to change it. There is a deadline.'},
      {head:'You can have all of it deleted, at any time',
       body:'Ask us and everything goes. Single chapters never come out on their own, so deleting all of it is the only way to remove any of it.'},
      {head:'What a reader keeps, they keep',
       body:'A business that has read your record may hold on to what it read. Deleting stops future reads, not past ones.'}
    ]};
  }
}
</script>
