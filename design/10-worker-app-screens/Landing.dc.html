<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap');
    /* Grain — DESIGN.md §5 colour, §6 type, §7 spacing/radius/depth */
    :root{
      --ink:#1B2A44; --paper:#F5F6F3; --secondary:#5C6878;
      --rule:#7E8794;      /* 3.35:1 — every line that carries meaning */
      --hairline:#D3D7D6;  /* 1.34:1 — pure separation, never a state */
      --page:#E6E6E4;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);
         font-family:'Archivo',-apple-system,'Helvetica Neue',sans-serif;
         -webkit-font-smoothing:antialiased}
    a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink);text-decoration-thickness:2px}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    /* §6 — one family, hierarchy from width, weight and tracking */
    .t-title {font-stretch:125%;font-weight:700;font-size:28px;line-height:1.12;text-wrap:balance}
    .t-sec   {font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
    .t-rec   {font-weight:600;font-size:15px;line-height:1.3}
    .t-body  {font-weight:400;font-size:14px;line-height:1.6}
    .t-data  {font-weight:500;font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
    .t-meta  {font-weight:400;font-size:12px;line-height:1.4}
    /* labels ONLY — never a value, a date, a name or a sentence (§6) */
    .t-micro {font-weight:500;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.3}
    .t-serial{font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;line-height:1.2}
    .t-inst  {font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
    /* §7 depth presses down; verified rows have zero press-give — rigidity is
       how permanence is expressed. Both halves are load-bearing. */
    .press{transition:transform 60ms cubic-bezier(0.2,0,0,1)}
    .press:active{transform:translateY(2px)}
    .rigid:active{transform:none}
    /* §8 buttons — no pills, no icons inside. 44px minimum (§12). */
    .btn-primary{background:var(--ink);color:var(--paper);border-radius:3px;
                 padding:13px 16px;font-weight:600;font-size:15px;width:100%;
                 text-align:center;min-height:44px}
    .btn-secondary{border:1px solid var(--ink);border-radius:3px;padding:12px 16px;
                   font-weight:600;font-size:15px;width:100%;text-align:center;min-height:44px}
    .btn-tertiary{font-weight:600;font-size:14px;text-decoration:underline;
                  text-underline-offset:3px;min-height:44px;padding:13px 8px;display:inline-block}
    /* a disabled control loses its ink, never its contrast (law 8) */
    .btn-primary[disabled]{background:none;color:var(--ink);border:1px solid var(--rule)}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:1ms !important;transition-duration:1ms !important;
        animation-delay:0ms !important;transition-delay:0ms !important}
    }

    .plate{position:absolute;inset:0;pointer-events:none}
    .reg{position:absolute;width:11px;height:11px;border:0 solid var(--ink);opacity:.55}
    .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
         border-bottom:1px solid var(--hairline);width:100%}
    .gutter{flex:0 0 26px;padding-top:3px}
    /* §10 — the attestation landing. One of only two heavy ceremonies.
       A state change of something already on screen: no overlay, no spawned UI. */
    .before{opacity:1}
    .after path{stroke-dasharray:1;stroke-dashoffset:1}
    .run .before{animation:fadeout 360ms cubic-bezier(0.2,0,0,1) forwards}
    .run .after path{animation:scribe 880ms cubic-bezier(0.2,0,0,1) forwards}
    .run .after path:nth-child(2){animation-delay:50ms}
    .run .after path:nth-child(3){animation-delay:100ms}
    .run .after path:nth-child(4){animation-delay:150ms}
    .run .after path:nth-child(5){animation-delay:150ms}
    .run .after path:nth-child(6){animation-delay:200ms}
    .done .before{opacity:0}
    .done .after path{stroke-dashoffset:0}
    @keyframes fadeout{to{opacity:0}}
    @keyframes scribe{to{stroke-dashoffset:0}}
    /* §7 — the seat. Pending rows sit 2px proud and seat flush on verification. */
    .seat{transform:translateY(-2px)}
    .run .seat{animation:seat 320ms cubic-bezier(0.2,0,0,1) 320ms forwards}
    .done .seat{transform:translateY(0)}
    @keyframes seat{to{transform:translateY(0)}}
    .contact{opacity:0}
    .run .contact{animation:contact 240ms cubic-bezier(0.2,0,0,1) 600ms}
    @keyframes contact{0%{opacity:.5}100%{opacity:0}}
  </style>
</helmet>

class Component extends DCLogic {

    this._u = setTimeout(() => this.setState({phase:'done'}), 1080);

  renderVals(){
    const done = this.state.phase === 'done';
    return {
      phase: this.state.phase,

      entries: done ? '48 entries · last today' : '47 entries · last 12 Aug 2026',
      replay: () => { clearTimeout(this._u); this.setState({phase:'idle'});
                      setTimeout(() => this.run(), 60); }
    };
  }
}
