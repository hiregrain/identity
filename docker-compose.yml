# Two Postgres servers, one per plane (decision 011: the spine/payload
# split is physical). Separate containers rather than two databases in one
# cluster, so the planes cannot share a server-level channel (FDW/dblink,
# banned in foundation/07) even by accident. Ports bind loopback only;
# 5433/5434 avoid colliding with a host Postgres install. No volumes: a
# `docker compose down && up` is a from-empty database, which is what the
# replay check relies on.
services:
  spine:
    image: postgres:18
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: spine
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d spine"]
      interval: 2s
      timeout: 3s
      retries: 30
  payload:
    image: postgres:18
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: payload
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d payload"]
      interval: 2s
      timeout: 3s
      retries: 30
