packages:
  # contract/runner is the TypeScript half of the golden-vector check
  # (trust-kernel/01). It is a workspace package so `make ts-check` runs it
  # without a second registration anywhere.
  - contract/*
  - surfaces/*

# pnpm 10 blocks dependency install scripts by default. Skia's is what unpacks
# the precompiled binaries decision 040 records the project cannot patch, so
# without this entry the renderer resolves and never links. Every other
# dependency stays blocked.
onlyBuiltDependencies:
  - '@shopify/react-native-skia'
